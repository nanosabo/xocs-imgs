name: Sync with crossoutcore.ru

on:
  schedule:
    # Daily at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Lets us test changes to the sync automation itself. Commits made by the
  # workflow use GITHUB_TOKEN, so they do not retrigger this workflow.
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write
  # Needed to request a Pages build: GITHUB_TOKEN pushes do not trigger the
  # automatic "pages build and deployment" workflow.
  pages: write

concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    name: Sync images and parts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync
        shell: bash
        run: |
          set -o pipefail
          node scripts/sync.mjs | tee "$RUNNER_TEMP/sync-report.txt"

      - name: Add report to summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt" 2>/dev/null || echo "No report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🔄SYNC: update images and parts"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        id: pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")

          echo "$response" | jq .
          echo "build_url=$(echo "$response" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_URL: ${{ steps.pages.outputs.build_url }}
        run: |
          for attempt in $(seq 1 120); do
            response=$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$BUILD_URL")

            status=$(echo "$response" | jq -r '.status')
            echo "Pages build status: $status"

            case "$status" in
              built)
                exit 0
                ;;
              errored)
                echo "$response" | jq .
                echo "::error::GitHub Pages build failed"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "::error::Timed out waiting for the GitHub Pages build"
          exit 1
